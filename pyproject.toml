[project]
name = "datephrase"
version = "0.2.1"
description = "Read English date phrases into typed, JSON-ready dates, periods and durations, with provenance (a thin layer over dateparser)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "aminesayagh", email = "aminesayagh1997@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dateparser==1.4.3",
    "python-dateutil==3.0.0",
    "text2num==3.1.0",
]

[project.urls]
Repository = "https://github.com/aminesayagh/datephrase"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
