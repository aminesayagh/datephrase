[project]
name = "temporal-reader"
version = "0.1.0"
description = "Thin wrapper over dateparser: English date expressions to a serialized date with metadata"
readme = "README.md"
authors = [
    { name = "aminesayagh", email = "aminesayagh1997@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dateparser==1.4.3",
    "python-dateutil==3.0.0",
]

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
